# =====================================================================
# CI/CD — Function Serverless de autenticação
# ---------------------------------------------------------------------
# PR              -> testes + validação do Terraform
# push na main    -> testes + deploy no ambiente 'hom' + smoke test
# Run workflow    -> deploy em 'hom' ou 'prod' (promoção manual)
#
# Fase 4: a função consulta o cliente no OS Service (ADR 011) — por isso o
# deploy depende do OS Service já implantado (a URL do LB interno dele vem
# do SSM). Com a sessão do Learner Lab fechada ou o OS ainda fora do ar, o
# deploy é PULADO com aviso, não falha (mesmo critério do CD dos serviços).
#
# Os testes rodam antes de tudo e barram o deploy.
# =====================================================================
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente
        type: choice
        options: [hom, prod]
        default: hom

concurrency:
  group: lambda-auth-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  TF_VERSION: "1.9.8"
  NODE_VERSION: "22"
  AWS_REGION: us-east-1

jobs:
  # ===================================================================
  # 1) Testes do código da função
  # ===================================================================
  testes:
    name: Testes (Vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Cobrem a validação de CPF (incluindo equivalência com o algoritmo
      # Java), o contrato do token do ADR 001 e o contrato com a rota
      # interna do OS Service (ADR 011).
      - name: Testes
        run: npm test

  # ===================================================================
  # 2) Validação do Terraform
  # ===================================================================
  terraform-validar:
    name: Terraform — formato e sintaxe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # ===================================================================
  # 3) Deploy
  # ===================================================================
  deploy:
    name: Deploy (${{ inputs.ambiente || 'hom' }})
    needs: [testes, terraform-validar]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ inputs.ambiente || 'hom' }}
    # Tudo o que entra nos scripts passa por variável de ambiente.
    env:
      AMBIENTE: ${{ inputs.ambiente || 'hom' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: O ambiente está no ar?
        id: ambiente
        env:
          RESULTADO_CREDENCIAIS: ${{ steps.aws.outcome }}
        run: |
          motivo=""
          if [ "$RESULTADO_CREDENCIAIS" != success ] || ! aws sts get-caller-identity >/dev/null 2>&1; then
            motivo="credenciais AWS vencidas (sessão do Learner Lab fechada)"
          elif ! aws ssm get-parameter --name "/oficina/${AMBIENTE}/os/url-interna" >/dev/null 2>&1; then
            motivo="OS Service ainda não implantado em '${AMBIENTE}' (sem /oficina/${AMBIENTE}/os/url-interna)"
          fi
          if [ -n "$motivo" ]; then
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy pulado: ${motivo}."
            echo "## Deploy pulado — ${motivo}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ambiente.outputs.disponivel == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # --omit=dev: o zip da função não leva vitest nem nada de teste.
      # O Terraform empacota o que estiver em node_modules neste momento.
      - name: Dependências de produção
        if: steps.ambiente.outputs.disponivel == 'true'
        run: npm ci --omit=dev

      - uses: hashicorp/setup-terraform@v3
        if: steps.ambiente.outputs.disponivel == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        if: steps.ambiente.outputs.disponivel == 'true'
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="key=lambda-auth/${AMBIENTE}/terraform.tfstate"

      # URL interna, token e chave privada vêm do SSM/Secrets Manager no
      # apply (infra/main.tf): nada disso passa pelo GitHub.
      - name: Apply
        if: steps.ambiente.outputs.disponivel == 'true'
        working-directory: infra
        run: terraform apply -auto-approve -input=false -var="ambiente=${AMBIENTE}"

      - name: Captura a URL do gateway
        id: saida
        if: steps.ambiente.outputs.disponivel == 'true'
        working-directory: infra
        run: echo "invoke_url=$(terraform output -raw invoke_url)" >> "$GITHUB_OUTPUT"

      # Prova que o deploy funcionou de verdade: um CPF inválido tem que
      # voltar 400 — resposta que só a função consegue dar. Se o gateway
      # ou a Lambda estiverem quebrados, vem 500 ou 502 e o job falha.
      - name: Smoke test
        if: steps.ambiente.outputs.disponivel == 'true'
        env:
          URL: ${{ steps.saida.outputs.invoke_url }}/auth/cliente
        run: |
          echo "Testando $URL"
          codigo=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            --retry 5 --retry-delay 3 --retry-all-errors \
            -X POST "$URL" -H 'Content-Type: application/json' \
            -d '{"cpf":"111.111.111-11"}')
          echo "HTTP $codigo — $(cat /tmp/resp.json)"
          test "$codigo" = "400" || { echo "Esperado 400 para CPF invalido"; exit 1; }
          echo "Smoke test OK: a funcao esta no ar e validando CPF."

      - name: Resumo
        if: always() && steps.ambiente.outputs.disponivel == 'true'
        env:
          URL: ${{ steps.saida.outputs.invoke_url }}
        run: |
          {
            echo "## Function de autenticação — \`${AMBIENTE}\`"
            echo
            echo "Endpoint: \`${URL}/auth/cliente\`"
          } >> "$GITHUB_STEP_SUMMARY"
